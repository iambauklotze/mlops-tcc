# Continuous integration (decision P-16): lint, tests, secret scan and image build.
name: ci

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # full history for the secret scan

      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.13.7"

      - name: Install dependencies (from lockfile)
        run: uv sync --frozen

      - name: Pre-commit hooks (ruff, gitleaks on tree, hygiene)
        run: uv run pre-commit run --all-files --show-diff-on-failure

      - name: Tests
        run: uv run pytest -q

  secret-history:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      # Official image, same version as the pre-commit hook; scans every commit.
      # (gitleaks-action@v2 failed on a branch's first push: it scans from the
      # root commit's parent, which does not exist.)
      - name: Gitleaks over full git history
        run: >-
          docker run --rm -v "$PWD:/repo" -w /repo
          ghcr.io/gitleaks/gitleaks:v8.30.0
          git /repo --redact --no-banner --verbose

  docker-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build collector image
        run: docker build -t mlops-tcc/collector:ci .
